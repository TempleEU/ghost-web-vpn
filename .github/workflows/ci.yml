name: Ghost Web VPN CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Validate required files
        run: |
          test -f background.js
          test -f popup.html
          test -f popup.js
          test -f popup.css
          test -f icon.svg
          test -f server/docker-compose.yml
          test -f server/.env.example
      - name: Validate extension manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          assert m['manifest_version']==3
          assert m['action']['default_popup']=='popup.html'
          assert m['background']['service_worker']=='background.js'
          assert 'proxy' in m['permissions']
          print('Extension manifest OK')
          PY
      - name: Create CI-only server environment
        run: |
          cat > server/.env <<'EOF'
          SERVERURL=127.0.0.1
          SERVERPORT=51820
          PEERS=ci-peer
          PEERDNS=1.1.1.1
          INTERNAL_SUBNET=10.66.66.0
          PROXY_PORT=1080
          PROXY_USER=ci-user
          PROXY_PASSWORD=ci-password-only
          TZ=UTC
          EOF
      - name: Validate server compose
        run: docker compose -f server/docker-compose.yml config --quiet
      - name: Secret hygiene
        run: |
          ! grep -RInE 'PRIVATE_KEY=|WG_PRIVATE_KEY=' . --exclude-dir=.git || (echo 'Potential private key found'; exit 1)
      - name: Package extension
        run: |
          mkdir -p dist
          zip -q -r dist/ghost-web-vpn.zip manifest.json background.js popup.html popup.js popup.css icon.svg README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-extension
          path: dist/ghost-web-vpn.zip
