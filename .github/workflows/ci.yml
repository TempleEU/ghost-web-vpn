name: Ghost Web VPN CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Syntax-check extension scripts
        run: |
          node --check background.js
          node --check popup.js
          node --check spoof.js
          node --check presets.js
      - name: Validate required files
        run: |
          test -f background.js
          test -f popup.html
          test -f popup.js
          test -f popup.css
          test -f spoof.js
          test -f presets.js
          test -f icon.svg
          test -f QUICKSTART.md
          test -f icons/icon16.png
          test -f icons/icon32.png
          test -f icons/icon48.png
          test -f icons/icon128.png
          test -f server/docker-compose.yml
          test -f server/.env.example
          test -f server/free-self-hosted/setup-free-endpoint.sh
      - name: Validate extension manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          assert m['manifest_version']==3
          assert m['action']['default_popup']=='popup.html'
          assert m['background']['service_worker']=='background.js'
          assert 'proxy' in m['permissions']
          assert 'privacy' in m['permissions']
          assert m['content_scripts'][0]['matches']==['<all_urls>']
          assert m['content_scripts'][0]['js']==['spoof.js']
          assert m['content_scripts'][0]['run_at']=='document_start'
          assert set(m['icons']) >= {'16','32','48','128'}
          assert all(m['icons'][k].endswith('.png') for k in m['icons'])
          print('Extension manifest OK')
          PY
      - name: Create CI-only server environment
        run: |
          cat > server/.env <<'EOF'
          SERVERURL=127.0.0.1
          SERVERPORT=51820
          PEERS=ci-peer
          PEERDNS=1.1.1.1
          INTERNAL_SUBNET=10.66.66.0
          PROXY_PORT=1080
          PROXY_USER=ci-user
          PROXY_PASSWORD=ci-password-only
          TZ=UTC
          EOF
      - name: Validate server compose
        run: docker compose -f server/docker-compose.yml config --quiet
      - name: Shellcheck setup script
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck server/free-self-hosted/setup-free-endpoint.sh
          else
            echo 'shellcheck not available; skipping'
          fi
      - name: Secret hygiene
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=dist --exclude='ci.yml' --exclude='*.md' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|WG_PRIVATE_KEY=|PRIVATE_KEY=)' .; then
            echo 'Potential private key material found in repository files.'
            exit 1
          fi
          echo 'No private key material detected.'
      - name: Package extension
        run: |
          mkdir -p dist
          zip -q -r dist/ghost-web-vpn.zip manifest.json background.js popup.html popup.js popup.css spoof.js presets.js icon.svg icons README.md QUICKSTART.md
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-extension
          path: dist/ghost-web-vpn.zip
