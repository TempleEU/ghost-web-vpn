name: Ghost Web VPN CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Validate required files
        run: |
          test -f background.js
          test -f popup.html
          test -f popup.js
          test -f popup.css
          test -f icon.svg
          test -f server/docker-compose.yml
          test -f server/.env.example
      - name: Validate extension manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          assert m['manifest_version']==3
          assert m['action']['default_popup']=='popup.html'
          assert m['background']['service_worker']=='background.js'
          assert 'proxy' in m['permissions']
          print('Extension manifest OK')
          PY
      - name: Validate server compose
        run: |
          cp server/.env.example server/.env
          sed -i 's/^SERVERURL=.*/SERVERURL=127.0.0.1/' server/.env
          sed -i 's/^PROXY_PASSWORD=.*/PROXY_PASSWORD=ci-test-only-random-secret/' server/.env
          docker compose -f server/docker-compose.yml config --quiet
      - name: Secret hygiene
        run: |
          ! grep -RInE 'PRIVATE_KEY=|WG_PRIVATE_KEY=|password:[[:space:]]*[^$<]' server --exclude='*.example' --exclude='README.md' || (echo 'Potential secret found'; exit 1)
      - name: Package extension
        run: |
          mkdir -p dist
          zip -q -r dist/ghost-web-vpn.zip manifest.json background.js popup.html popup.js popup.css icon.svg README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-extension
          path: dist/ghost-web-vpn.zip
